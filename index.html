<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>PHANTON — панель управления</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0d;
      --panel: #111114;
      --panel-raised: #17171b;
      --line: rgba(255, 255, 255, .075);
      --text: #f5f3f4;
      --muted: #929096;
      --red: #f23b51;
      --red-strong: #ff4259;
      --green: #6ed4a0;
      --yellow: #f4bd69;
      --radius: 19px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 78% -15%, rgba(180, 24, 47, .16), transparent 42%),
        radial-gradient(ellipse at -12% 65%, rgba(107, 15, 30, .1), transparent 36%),
        var(--bg);
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .ambient {
      position: fixed;
      z-index: -1;
      top: 16vh;
      right: 3vw;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(225, 34, 60, .11);
      filter: blur(85px);
      animation: breathe 7s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes breathe {
      from { transform: scale(.8); opacity: .55; }
      to { transform: scale(1.25); opacity: 1; }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      to { background-position: -200% 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .layout {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr);
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 30px 17px 22px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(10, 10, 12, .72);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 11px 35px; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 66, 89, .38);
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, #ff485d, #a40f28);
      box-shadow: 0 7px 24px rgba(242, 59, 81, .23);
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.08em;
    }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: .12em; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 9px; letter-spacing: .15em; }
    .nav-label { padding: 0 12px 9px; color: #66646b; font-size: 10px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: #a09ea5;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .nav-button:hover { color: white; background: rgba(255, 255, 255, .045); transform: translateX(2px); }
    .nav-button.active {
      color: #fff;
      border-color: rgba(242, 59, 81, .18);
      background: linear-gradient(90deg, rgba(242, 59, 81, .14), rgba(242, 59, 81, .025));
    }
    .nav-button.active .nav-icon { color: var(--red-strong); }
    .nav-icon { width: 18px; height: 18px; flex: none; }
    .nav-count {
      min-width: 21px;
      margin-left: auto;
      padding: 3px 6px;
      border-radius: 7px;
      color: #ff9aa6;
      background: rgba(242, 59, 81, .12);
      font-size: 10px;
      text-align: center;
    }
    .sidebar-bottom { margin-top: auto; }
    .connection-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .025);
    }
    .connection-top { display: flex; align-items: center; gap: 8px; color: #c6c4ca; font-size: 11px; }
    .connection-light { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 11px rgba(110, 212, 160, .75); }
    .connection-light.off { background: #737178; box-shadow: none; }
    .connection-hint { padding: 9px 0 0 15px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .side-profile { display: flex; align-items: center; gap: 10px; padding: 18px 8px 0; cursor: pointer; }
    .avatar {
      display: grid;
      flex: none;
      place-items: center;
      width: 39px;
      height: 39px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 13px;
      color: #ffdce0;
      background: linear-gradient(145deg, #422027, #241216);
      font-size: 13px;
      font-weight: 750;
      text-transform: uppercase;
    }
    .side-name { overflow: hidden; color: #efedf0; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .side-id { margin-top: 4px; color: var(--muted); font-size: 10px; }

    .main { min-width: 0; padding: 0 42px 45px; }
    .topbar { min-height: 91px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .page-title { margin: 0; font-size: 21px; font-weight: 730; letter-spacing: -.035em; }
    .page-subtitle { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .live-label { display: flex; align-items: center; gap: 7px; color: #aaa8af; font-size: 10px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 9px rgba(110, 212, 160, .8); }
    .icon-button {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #c7c5cb;
      background: rgba(255, 255, 255, .025);
      cursor: pointer;
      transition: .18s ease;
    }
    .icon-button:hover { border-color: rgba(242, 59, 81, .45); color: white; background: rgba(242, 59, 81, .09); }
    .icon-button svg { width: 16px; height: 16px; }
    .icon-button.spinning svg { animation: spin .8s linear infinite; }
    .content { padding-top: 28px; animation: appear .32s ease both; }
    .content.reenter { animation: appear .32s ease both; }
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 154px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 27px 30px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 21px;
      background:
        radial-gradient(ellipse at 85% 5%, rgba(240, 42, 65, .21), transparent 40%),
        linear-gradient(112deg, #171316, #121214 61%, #1c1115);
    }
    .hero::after {
      content: "P";
      position: absolute;
      top: -42px;
      right: 30px;
      color: rgba(255, 255, 255, .035);
      font-size: 210px;
      font-weight: 900;
      font-style: italic;
      line-height: 1;
      pointer-events: none;
    }
    .eyebrow { color: #ff7d8c; font-size: 9px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
    .hero h2 { margin: 10px 0 7px; font-size: clamp(21px, 3vw, 28px); font-weight: 740; letter-spacing: -.045em; }
    .hero p { max-width: 440px; margin: 0; color: #aaa5aa; font-size: 12px; line-height: 1.65; }
    .hero-action {
      z-index: 1;
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid rgba(255, 106, 124, .38);
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, #f23b51, #bd1d35);
      box-shadow: 0 8px 22px rgba(192, 25, 49, .23);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .hero-action:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(192, 25, 49, .32); }
    .hero-action svg { width: 14px; height: 14px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-top: 16px; }
    .stat-card {
      min-height: 111px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .012));
      transition: transform .2s ease, border-color .2s ease;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: rgba(242, 59, 81, .25); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .stat-icon { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 9px; color: #ff8390; background: rgba(242, 59, 81, .11); }
    .stat-icon svg { width: 14px; height: 14px; }
    .stat-value { margin-top: 10px; font-size: 26px; font-weight: 760; letter-spacing: -.05em; }
    .stat-foot { margin-top: 3px; color: #77757d; font-size: 9px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 30px 0 13px; }
    .section-heading h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .chat-tools { display: flex; align-items: center; gap: 8px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; top: 50%; left: 11px; width: 14px; height: 14px; color: #78767d; transform: translateY(-50%); pointer-events: none; }
    .search {
      width: 188px;
      height: 34px;
      padding: 0 10px 0 32px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: rgba(255, 255, 255, .025);
      font-size: 10px;
      transition: border-color .18s ease, background .18s ease;
    }
    .search:focus { border-color: rgba(242, 59, 81, .45); background: rgba(255, 255, 255, .045); }
    .filters { display: flex; gap: 5px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .02); }
    .filter-button { padding: 7px 9px; border: 0; border-radius: 7px; color: #96939a; background: transparent; font-size: 9px; cursor: pointer; transition: .15s ease; }
    .filter-button:hover { color: white; }
    .filter-button.active { color: white; background: #292126; box-shadow: inset 0 0 0 1px rgba(242, 59, 81, .17); }
    .chat-list { display: grid; gap: 8px; }
    .chat-row {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .022);
      text-align: left;
      cursor: pointer;
      transition: transform .17s ease, border-color .17s ease, background .17s ease;
      animation: appear .28s ease both;
    }
    .chat-row:hover { transform: translateY(-2px); border-color: rgba(242, 59, 81, .28); background: rgba(255, 255, 255, .04); }
    .chat-row .avatar { width: 42px; height: 42px; border-radius: 14px; color: #f9d8dc; background: linear-gradient(145deg, #402026, #201417); }
    .chat-main { min-width: 0; }
    .chat-name-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .chat-name { overflow: hidden; font-size: 12px; font-weight: 690; text-overflow: ellipsis; white-space: nowrap; }
    .chat-username { overflow: hidden; margin-top: 4px; color: #85828a; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-preview { overflow: hidden; margin-top: 6px; color: #6f6d74; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .chat-end { display: flex; align-items: end; flex-direction: column; gap: 8px; }
    .chat-time { color: #817e86; font-size: 9px; white-space: nowrap; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      border: 1px solid rgba(242, 59, 81, .15);
      border-radius: 7px;
      color: #ff8d9b;
      background: rgba(242, 59, 81, .08);
      font-size: 9px;
      white-space: nowrap;
    }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status.replied { border-color: rgba(110, 212, 160, .14); color: #87dcb1; background: rgba(110, 212, 160, .07); }
    .status.muted { border-color: var(--line); color: #99969d; background: rgba(255, 255, 255, .035); }
    .status.disconnected { border-color: var(--line); color: #a7a4aa; background: rgba(255, 255, 255, .035); }
    .empty {
      display: grid;
      min-height: 210px;
      place-items: center;
      padding: 30px;
      border: 1px dashed rgba(255, 255, 255, .1);
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }
    .empty-mark { width: 43px; height: 43px; display: grid; place-items: center; margin: 0 auto 12px; border: 1px solid rgba(242, 59, 81, .2); border-radius: 14px; color: #ff7788; background: rgba(242, 59, 81, .08); font-size: 17px; }
    .empty strong { display: block; margin-bottom: 5px; color: #d7d5da; font-size: 12px; }
    .empty span { display: block; max-width: 270px; font-size: 10px; line-height: 1.6; }
    .error-box {
      display: flex;
      align-items: start;
      gap: 11px;
      padding: 15px;
      border: 1px solid rgba(242, 59, 81, .24);
      border-radius: 13px;
      color: #ffb6be;
      background: rgba(242, 59, 81, .07);
      font-size: 11px;
      line-height: 1.6;
    }
    .error-box button { flex: none; margin-left: auto; border: 0; color: white; background: transparent; cursor: pointer; }
    .page-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(230px, .75fr); gap: 15px; }
    .panel { padding: 20px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255, 255, 255, .025); }
    .panel h2 { margin: 0 0 15px; font-size: 13px; }
    .profile-head { display: flex; align-items: center; gap: 13px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .profile-head .avatar { width: 55px; height: 55px; border-radius: 17px; font-size: 16px; }
    .profile-title { font-size: 14px; font-weight: 700; }
    .profile-handle { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .info-list { display: grid; }
    .info-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, .045); font-size: 10px; }
    .info-item:last-child { border: 0; }
    .info-label { color: var(--muted); }
    .info-value { color: #e2e0e4; text-align: right; overflow-wrap: anywhere; }
    .feature-list { display: grid; gap: 10px; }
    .feature { display: flex; gap: 10px; padding: 11px; border: 1px solid rgba(255,255,255,.055); border-radius: 12px; background: rgba(255,255,255,.018); }
    .feature-mark { width: 26px; height: 26px; display: grid; flex: none; place-items: center; border-radius: 8px; color: #ff8390; background: rgba(242,59,81,.1); font-size: 11px; }
    .feature strong { display: block; font-size: 10px; }
    .feature span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.55; }
    .command { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.045); }
    .command:last-child { border: 0; }
    .command code { color: #ff9aa6; font-size: 10px; }
    .command span { color: #96939a; font-size: 9px; text-align: right; }
    .skeleton {
      height: 68px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(100deg, #121215 20%, #1c1b20 38%, #121215 56%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }
    .mobile-bottom { display: none; }

    dialog {
      width: min(420px, calc(100% - 30px));
      padding: 0;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      color: var(--text);
      background: #131316;
      box-shadow: 0 25px 80px rgba(0,0,0,.6);
    }
    dialog::backdrop { background: rgba(0,0,0,.68); backdrop-filter: blur(5px); }
    .dialog-inner { padding: 21px; animation: appear .2s ease both; }
    .dialog-top { display: flex; align-items: start; justify-content: space-between; }
    .dialog-close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: transparent; cursor: pointer; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .action-button { min-height: 38px; border: 1px solid var(--line); border-radius: 10px; color: #dfdce1; background: rgba(255,255,255,.035); font-size: 10px; cursor: pointer; transition: .16s ease; }
    .action-button:hover { border-color: rgba(242,59,81,.3); background: rgba(242,59,81,.08); }
    .action-button.primary { border-color: rgba(242,59,81,.24); color: #ffadb7; background: rgba(242,59,81,.1); }

    @media (max-width: 1080px) {
      .main { padding-right: 28px; padding-left: 28px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .layout { display: block; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
      .sidebar { display: none; }
      .main { padding: 0 17px 25px; }
      .topbar { min-height: 72px; }
      .page-title { font-size: 18px; }
      .page-subtitle { font-size: 10px; }
      .content { padding-top: 18px; }
      .hero { min-height: 165px; align-items: start; flex-direction: column; padding: 21px; }
      .hero::after { top: -25px; right: 10px; font-size: 170px; }
      .hero h2 { max-width: 250px; font-size: 22px; }
      .hero p { max-width: 270px; font-size: 10px; }
      .hero-action { padding: 9px 12px; font-size: 10px; }
      .stats-grid { gap: 9px; margin-top: 10px; }
      .stat-card { min-height: 99px; padding: 13px; }
      .stat-value { margin-top: 8px; font-size: 23px; }
      .stat-top { font-size: 9px; }
      .section-heading { align-items: start; flex-direction: column; margin-top: 25px; }
      .chat-tools { width: 100%; flex-wrap: wrap; }
      .search-wrap { flex: 1; }
      .search { width: 100%; }
      .chat-row { grid-template-columns: 39px minmax(0, 1fr) auto; gap: 10px; padding: 11px; }
      .chat-row .avatar { width: 39px; height: 39px; }
      .chat-time { font-size: 8px; }
      .status { font-size: 8px; }
      .page-grid { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
      .mobile-bottom {
        position: fixed;
        z-index: 5;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 8px 9px calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid rgba(255,255,255,.075);
        background: rgba(13,13,15,.92);
        backdrop-filter: blur(18px);
      }
      .mobile-bottom .nav-button { justify-content: center; flex-direction: column; gap: 5px; padding: 6px; font-size: 9px; }
      .mobile-bottom .nav-icon { width: 17px; height: 17px; }
      .mobile-bottom .nav-count { position: absolute; transform: translate(18px,-8px); }
    }
    @media (max-width: 380px) {
      .main { padding-right: 12px; padding-left: 12px; }
      .filters { width: 100%; justify-content: space-between; }
      .filter-button { flex: 1; padding-right: 5px; padding-left: 5px; }
      .chat-row { grid-template-columns: 35px minmax(0, 1fr); }
      .chat-row .avatar { width: 35px; height: 35px; }
      .chat-end { grid-column: 2; align-items: start; flex-direction: row; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div><div class="brand-name">PHANTON</div><div class="brand-caption">BUSINESS ASSISTANT</div></div>
      </div>
      <div class="nav-label">Рабочее пространство</div>
      <nav class="nav" aria-label="Основная навигация">
        <button class="nav-button active" data-page="home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
          Обзор <span class="nav-count" id="navWaiting">0</span>
        </button>
        <button class="nav-button" data-page="profile">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
          Профиль
        </button>
        <button class="nav-button" data-page="help">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1.1-1.9 1.4-1.9 3"/><path d="M12 17.5h.01"/></svg>
          Возможности
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card">
          <div class="connection-top"><span class="connection-light" id="connectionLight"></span><span id="connectionText">Проверяем подключение</span></div>
          <div class="connection-hint" id="connectionHint">Статус Business-аккаунта</div>
        </div>
        <div class="side-profile" data-page="profile">
          <div class="avatar" id="sideAvatar">P</div>
          <div style="min-width:0"><div class="side-name" id="sideName">Загрузка профиля</div><div class="side-id" id="sideId">PHANTON</div></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><h1 class="page-title" id="pageTitle">Обзор</h1><div class="page-subtitle" id="pageSubtitle">Все диалоги и активность в одном месте</div></div>
        <div class="top-actions">
          <div class="live-label"><span class="live-dot"></span><span>LIVE</span></div>
          <button class="icon-button" id="refreshButton" aria-label="Обновить данные" title="Обновить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>
          </button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite">
        <div class="skeleton"></div>
        <div class="skeleton" style="margin-top:10px"></div>
        <div class="skeleton" style="height:220px;margin-top:18px"></div>
      </section>
    </main>
  </div>

  <nav class="mobile-bottom" aria-label="Основная навигация">
    <button class="nav-button active" data-page="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
      Главная
    </button>
    <button class="nav-button" data-page="profile">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
      Профиль
    </button>
    <button class="nav-button" data-page="help">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1.1-1.9 1.4-1.9 3"/><path d="M12 17.5h.01"/></svg>
      Помощь
    </button>
  </nav>

  <dialog id="chatDialog"></dialog>

  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();
      tg?.setHeaderColor?.("#0b0b0d");
      tg?.setBackgroundColor?.("#0b0b0d");

      const state = { data: null, page: "home", filter: "all", query: "", loading: false };
      const content = document.getElementById("content");
      const title = document.getElementById("pageTitle");
      const subtitle = document.getElementById("pageSubtitle");
      const dialog = document.getElementById("chatDialog");
      const initData = tg?.initData || "";
      const API_BASE_URL = "https://phanton-api.ctrlfree.host";
      const headers = () => ({ Authorization: `tma ${initData}` });
      const apiUrl = (route) => `${API_BASE_URL}${route}`;
      const escapeInitials = (name) => (name || "P").trim().split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
      const formatTime = (timestamp) => {
        if (!timestamp) return "Нет сообщений";
        const date = new Date(timestamp * 1000);
        const today = new Date();
        if (date.toDateString() === today.toDateString()) {
          return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        }
        return date.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
      };
      const formatDate = (timestamp) => timestamp
        ? new Date(timestamp * 1000).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" })
        : "—";
      const displayName = (chat) => chat.name || (chat.username ? `@${chat.username}` : `ID ${chat.userId}`);
      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const iconSvg = {
        refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>',
      };

      function setHeader(page) {
        const headersByPage = {
          home: ["Обзор", "Все диалоги и активность в одном месте"],
          profile: ["Профиль", "Ваш аккаунт и подключение Telegram Business"],
          help: ["Возможности", "Инструменты PHANTON и быстрые команды"],
        };
        [title.textContent, subtitle.textContent] = headersByPage[page];
        document.querySelectorAll("[data-page]").forEach((button) => {
          button.classList.toggle("active", button.dataset.page === page);
        });
      }

      function setError(message) {
        const box = el("div", "error-box");
        const text = el("div", "", message);
        const retry = el("button", "", "Повторить");
        retry.addEventListener("click", loadDashboard);
        box.append(text, retry);
        content.querySelector(".error-box")?.remove();
        if (state.data) content.prepend(box);
        else content.replaceChildren(box);
      }

      async function loadDashboard() {
        if (!API_BASE_URL) {
          setError("Mini App опубликован, сервер данных ещё не подключён.");
          return;
        }
        if (!initData) {
          setError("Откройте PHANTON Mini App из Telegram: для защиты списка чатов требуется проверенная авторизация.");
          return;
        }
        if (state.loading) return;
        state.loading = true;
        const refresh = document.getElementById("refreshButton");
        refresh?.classList.add("spinning");
        try {
          const response = await fetch(apiUrl("/api/dashboard"), { headers: headers(), cache: "no-store" });
          const responseText = await response.text();
          let result;
          try {
            result = JSON.parse(responseText);
          } catch {
            throw new Error(`Сервер вернул некорректный ответ (HTTP ${response.status}).`);
          }
          if (!response.ok) throw new Error(result.error || "Не удалось загрузить данные.");
          state.data = result;
          updateProfileSummary();
          renderPage();
        } catch (error) {
          const message = error instanceof TypeError
            ? "Не удалось подключиться к API. Адрес phanton-api доступен только внутри сети хостинга; для GitHub Pages нужен публичный HTTPS-адрес."
            : error.message || "Не удалось подключиться к API.";
          setError(message);
        } finally {
          state.loading = false;
          refresh?.classList.remove("spinning");
        }
      }

      function updateProfileSummary() {
        const profile = state.data.profile;
        const fullName = [profile.firstName, profile.lastName].filter(Boolean).join(" ") || "Пользователь PHANTON";
        document.getElementById("sideAvatar").textContent = escapeInitials(fullName);
        document.getElementById("sideName").textContent = fullName;
        document.getElementById("sideId").textContent = profile.username ? `@${profile.username}` : `ID ${profile.id}`;
        document.getElementById("navWaiting").textContent = state.data.stats.waitingCount;
        const connected = state.data.stats.activeConnections > 0;
        document.getElementById("connectionLight").classList.toggle("off", !connected);
        document.getElementById("connectionText").textContent = connected ? "Business подключён" : "Business не подключён";
        document.getElementById("connectionHint").textContent = connected
          ? `${state.data.stats.activeConnections} активное подключение`
          : "Подключите PHANTON в Telegram Business";
      }

      function createStat(label, value, foot, glyph) {
        const card = el("article", "stat-card");
        const top = el("div", "stat-top");
        top.append(el("span", "", label));
        const icon = el("span", "stat-icon", glyph);
        top.append(icon);
        card.append(top, el("div", "stat-value", String(value)), el("div", "stat-foot", foot));
        return card;
      }

      function makeEmpty(titleText, description) {
        const box = el("div", "empty");
        const inner = el("div");
        inner.append(el("div", "empty-mark", "✦"), el("strong", "", titleText), el("span", "", description));
        box.append(inner);
        return box;
      }

      function renderHome() {
        const { stats, chats } = state.data;
        const hero = el("section", "hero");
        const intro = el("div");
        intro.append(
          el("div", "eyebrow", "Telegram Business dashboard"),
          el("h2", "", "Вся переписка. Под контролем."),
          el("p", "", "Следите за диалогами, находите тех, кто ждёт ответа, и управляйте уведомлениями в одном месте.")
        );
        const helpButton = el("button", "hero-action");
        helpButton.append(document.createTextNode("Возможности"), document.createRange().createContextualFragment(iconSvg.arrow));
        helpButton.addEventListener("click", () => changePage("help"));
        hero.append(intro, helpButton);

        const statsGrid = el("div", "stats-grid");
        statsGrid.append(
          createStat("Все диалоги", stats.chatCount, "с момента начала отслеживания", "◉"),
          createStat("Ждут ответа", stats.waitingCount, "последнее входящее без ответа", "⌁"),
          createStat("Входящие сегодня", stats.inboundToday, "по московскому времени", "↓"),
          createStat("Исходящие сегодня", stats.outboundToday, "по московскому времени", "↑")
        );

        const section = el("section");
        const heading = el("div", "section-heading");
        const headingText = el("div");
        headingText.append(el("h2", "", "Все чаты"), el("p", "", `${chats.length} диалогов подключено к PHANTON`));
        const tools = el("div", "chat-tools");
        const searchWrap = el("label", "search-wrap");
        searchWrap.insertAdjacentHTML("afterbegin", iconSvg.search);
        const search = el("input", "search");
        search.type = "search";
        search.placeholder = "Имя, username или ID";
        search.value = state.query;
        search.setAttribute("aria-label", "Поиск по чатам");
        search.addEventListener("input", () => { state.query = search.value; renderChatList(list); });
        searchWrap.append(search);
        const filters = el("div", "filters");
        const filterOptions = [["all", "Все"], ["waiting", "Ждут"], ["muted", "Без звука"]];
        for (const [key, label] of filterOptions) {
          const button = el("button", `filter-button${state.filter === key ? " active" : ""}`, label);
          button.type = "button";
          button.addEventListener("click", () => { state.filter = key; renderPage(); });
          filters.append(button);
        }
        tools.append(searchWrap, filters);
        heading.append(headingText, tools);
        const list = el("div", "chat-list");
        renderChatList(list);
        section.append(heading, list);
        content.replaceChildren(hero, statsGrid, section);
      }

      function renderChatList(list) {
        if (!state.data || !list.isConnected && state.page !== "home") return;
        const query = state.query.trim().toLowerCase();
        const chats = state.data.chats.filter((chat) => {
          const matchesFilter = state.filter === "all" ||
            (state.filter === "waiting" && chat.waiting) ||
            (state.filter === "muted" && chat.muted);
          const matchesQuery = !query ||
            [chat.name, chat.username, String(chat.userId), String(chat.chatId)]
              .filter(Boolean).some((item) => item.toLowerCase().includes(query));
          return matchesFilter && matchesQuery;
        });
        list.replaceChildren();
        if (!chats.length) {
          list.append(makeEmpty(
            state.data.chats.length ? "Ничего не найдено" : "Пока нет диалогов",
            state.data.chats.length
              ? "Измените поиск или фильтр, чтобы увидеть чаты."
              : "Когда появятся входящие сообщения через Business, диалоги будут собраны здесь."
          ));
          return;
        }

        for (const [index, chat] of chats.entries()) {
          const row = el("button", "chat-row");
          row.type = "button";
          row.style.animationDelay = `${Math.min(index, 8) * 25}ms`;
          const avatar = el("span", "avatar", escapeInitials(displayName(chat)));
          const main = el("span", "chat-main");
          const nameLine = el("span", "chat-name-line");
          nameLine.append(el("span", "chat-name", displayName(chat)));
          if (!chat.connectionEnabled) nameLine.append(el("span", "status disconnected", "Business отключён"));
          main.append(nameLine);
          main.append(el("span", "chat-username", chat.username ? `@${chat.username} · ID ${chat.userId}` : `ID ${chat.userId}`));
          main.append(el("span", "chat-preview", `${chat.inboundCount} входящих · ${chat.outboundCount} исходящих`));
          const end = el("span", "chat-end");
          end.append(el("span", "chat-time", formatTime(chat.lastInboundAt || chat.firstMessageAt)));
          const status = el("span", `status${chat.waiting ? "" : " replied"}${chat.muted ? " muted" : ""}`,
            chat.muted ? "Без звука" : chat.waiting ? "Ждёт ответа" : "Всё хорошо");
          end.append(status);
          row.append(avatar, main, end);
          row.addEventListener("click", () => openChatDialog(chat));
          list.append(row);
        }
      }

      function renderProfile() {
        const { profile, stats } = state.data;
        const name = [profile.firstName, profile.lastName].filter(Boolean).join(" ") || "Пользователь PHANTON";
        const grid = el("div", "page-grid");
        const account = el("section", "panel");
        account.append(el("h2", "", "Аккаунт"));
        const head = el("div", "profile-head");
        head.append(el("div", "avatar", escapeInitials(name)));
        const userText = el("div");
        userText.append(el("div", "profile-title", name), el("div", "profile-handle", profile.username ? `@${profile.username}` : "Username не задан"));
        head.append(userText);
        const info = el("div", "info-list");
        [
          ["Telegram ID", profile.id],
          ["Username", profile.username ? `@${profile.username}` : "не задан"],
          ["Business", stats.activeConnections ? "Подключён" : "Не подключён"],
          ["Активные подключения", stats.activeConnections],
          ["Отслеживаемые чаты", stats.chatCount],
          ["Чаты без ответа", stats.waitingCount],
        ].forEach(([label, value]) => {
          const item = el("div", "info-item");
          item.append(el("span", "info-label", label), el("span", "info-value", String(value)));
          info.append(item);
        });
        account.append(head, info);

        const activity = el("section", "panel");
        activity.append(el("h2", "", "Инструменты PHANTON"));
        const features = el("div", "feature-list");
        [
          ["↺", "История сообщений", "Сохраняет полученные сообщения и сообщает об изменениях или удалении."],
          ["◷", "Напоминания", "Напоминает о диалоге в заданное время."],
          ["◉", "Контроль ответа", "Находит чаты без вашего ответа и сообщает о новых сообщениях."],
          ["◌", "Видеокружки", "Превращает отправленное видео в Telegram video note."],
        ].forEach(([mark, heading, body]) => {
          const feature = el("div", "feature");
          feature.append(el("span", "feature-mark", mark));
          const text = el("div");
          text.append(el("strong", "", heading), el("span", "", body));
          feature.append(text);
          features.append(feature);
        });
        activity.append(features);
        grid.append(account, activity);
        content.replaceChildren(grid);
      }

      function renderHelp() {
        const grid = el("div", "page-grid");
        const features = el("section", "panel");
        features.append(el("h2", "", "Что умеет PHANTON"));
        const featureList = el("div", "feature-list");
        [
          ["✎", "Изменения и удаления", "Сохраняет сообщения собеседников и присылает владельцу уведомление, если сообщение отредактировали или удалили."],
          ["◉", "Новые входящие", "Уведомляет владельца о входящих сообщениях и отправляет автоответ новому собеседнику."],
          ["◷", "Без ответа", "Через 35 минут собирает диалоги, где последнее входящее осталось без ответа."],
          ["↗", "Видео в кружок", "Отправьте боту обычное видео. Для обработки на сервере нужен ffmpeg."],
          ["▤", "Сводка дня", "Каждый день после 20:00 по Москве показывает статистику за день."],
        ].forEach(([mark, heading, body]) => {
          const feature = el("div", "feature");
          feature.append(el("span", "feature-mark", mark));
          const text = el("div");
          text.append(el("strong", "", heading), el("span", "", body));
          feature.append(text);
          featureList.append(feature);
        });
        features.append(featureList);

        const commands = el("section", "panel");
        commands.append(el("h2", "", "Команды в бизнес-чате"));
        const commandList = el("div");
        [
          [".info", "информация о диалоге"],
          [".stats", "статистика сообщений"],
          [".whois", "данные собеседника"],
          [".mute / .unmute", "управление уведомлениями"],
          [".remind 2h текст", "напоминание о чате"],
          [".bot", "проверить статус бота"],
        ].forEach(([command, description]) => {
          const row = el("div", "command");
          row.append(el("code", "", command), el("span", "", description));
          commandList.append(row);
        });
        commands.append(commandList);
        grid.append(features, commands);
        content.replaceChildren(grid);
      }

      function renderPage() {
        setHeader(state.page);
        if (!state.data) return;
        content.replaceChildren();
        content.classList.remove("reenter");
        void content.offsetWidth;
        content.classList.add("reenter");
        if (state.page === "home") renderHome();
        else if (state.page === "profile") renderProfile();
        else renderHelp();
      }

      function changePage(page) {
        state.page = page;
        renderPage();
      }

      function openChatDialog(chat) {
        dialog.replaceChildren();
        const inner = el("div", "dialog-inner");
        const top = el("div", "dialog-top");
        const header = el("div", "profile-head");
        header.style.padding = "0";
        header.style.border = "0";
        const avatar = el("div", "avatar", escapeInitials(displayName(chat)));
        const person = el("div");
        person.append(el("div", "profile-title", displayName(chat)), el("div", "profile-handle", chat.username ? `@${chat.username}` : `ID ${chat.userId}`));
        header.append(avatar, person);
        const close = el("button", "dialog-close", "×");
        close.type = "button";
        close.setAttribute("aria-label", "Закрыть");
        close.addEventListener("click", () => dialog.close());
        top.append(header, close);
        const info = el("div", "info-list");
        [
          ["Telegram ID", chat.userId],
          ["Язык", chat.languageCode || "не указан"],
          ["Первое сообщение", formatDate(chat.firstMessageAt)],
          ["Последнее входящее", formatTime(chat.lastInboundAt)],
          ["Входящие", chat.inboundCount],
          ["Ваши сообщения", chat.outboundCount],
          ["Статус", chat.waiting ? "Ждёт ответа" : "Ответили"],
          ["Business", chat.connectionEnabled ? "Подключён" : "Отключён"],
        ].forEach(([label, value]) => {
          const item = el("div", "info-item");
          item.append(el("span", "info-label", label), el("span", "info-value", String(value)));
          info.append(item);
        });
        const actions = el("div", "dialog-actions");
        const muteButton = el("button", "action-button primary", chat.muted ? "Включить уведомления" : "Отключить уведомления");
        muteButton.type = "button";
        muteButton.disabled = !chat.connectionEnabled;
        muteButton.addEventListener("click", async () => {
          muteButton.disabled = true;
          try {
            const response = await fetch(apiUrl(`/api/chats/${encodeURIComponent(chat.connectionId)}/${chat.chatId}/mute`), {
              method: "POST",
              headers: { ...headers(), "Content-Type": "application/json" },
              body: JSON.stringify({ muted: !chat.muted }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Не удалось изменить уведомления.");
            chat.muted = result.muted;
            dialog.close();
            renderPage();
          } catch (error) {
            muteButton.disabled = false;
            muteButton.textContent = error.message || "Ошибка сохранения";
          }
        });
        const openButton = el("button", "action-button", "Открыть в Telegram");
        openButton.type = "button";
        openButton.disabled = !chat.username;
        openButton.addEventListener("click", () => {
          if (chat.username) tg?.openTelegramLink(`https://t.me/${encodeURIComponent(chat.username)}`);
        });
        actions.append(muteButton, openButton);
        inner.append(top, info, actions);
        dialog.append(inner);
        dialog.showModal();
      }

      document.querySelectorAll("[data-page]").forEach((button) => {
        button.addEventListener("click", () => changePage(button.dataset.page));
      });
      document.getElementById("refreshButton").addEventListener("click", loadDashboard);
      loadDashboard();
      window.setInterval(() => {
        if (document.visibilityState === "visible" && !dialog.open) loadDashboard();
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") loadDashboard();
      });
    })();
  </script>
</body>
</html>
